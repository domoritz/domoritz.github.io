{% assign preview = site.data.publication_previews[include.pub.slug] %}
{% if preview %}
  <img class="publication-preview" src="{{ preview.src | relative_url }}" width="{{ preview.width }}" height="{{ preview.height }}" alt="" loading="lazy" decoding="async">
{% else %}
  <img class="publication-preview" src="{{ '/images/papers/fallback.avif' | relative_url }}" width="144" height="200" alt="" loading="lazy" decoding="async">
{% endif %}
