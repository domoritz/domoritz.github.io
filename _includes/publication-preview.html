{% assign preview_path = '/images/papers/' | append: include.pub.slug | append: '.avif' %}
{% assign preview_file = site.static_files | where: 'path', preview_path | first %}
{% unless preview_file %}{% assign preview_path = '/images/papers/fallback.avif' %}{% endunless %}
<img class="publication-preview" src="{{ preview_path | relative_url }}" width="192" height="268" alt="" loading="lazy" decoding="async">
