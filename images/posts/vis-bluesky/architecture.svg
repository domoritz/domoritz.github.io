<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">How the VIS 2026 paper discussions work</title>
  <desc id="desc">A paper page on the static conference website asks a discussion service for the thread that belongs to its paper id and sends comments and likes to it with a token from the conference login. The service has three parts: an announce bot that reads the program database and posts one announcement per paper on Bluesky shortly before its session, a read proxy that maps a paper id to the announcement and fetches the thread, and a guest bridge that posts comments as a shared Bluesky account. Attendees with a Bluesky account can also log in on the page and post from their own account without the service, or reply in the Bluesky app.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b6b"/>
    </marker>
    <style>
      .col { fill: #f8f8f8; stroke: #e2e2e2; }
      .col-bsky { fill: #eef5ff; stroke: #cfe0f7; }
      .box { fill: #fff; stroke: #b9b9b9; stroke-width: 1.2; }
      .box-bsky { fill: #fff; stroke: #1185fe; stroke-width: 1.2; }
      .head { font-size: 15px; font-weight: 700; fill: #333; }
      .name { font-size: 14px; font-weight: 700; fill: #333; }
      .sub { font-size: 11.5px; fill: #6b6b6b; }
      .arrow { fill: none; stroke: #6b6b6b; stroke-width: 1.4; marker-end: url(#arrow); }
      .label { font-size: 11px; fill: #414141; paint-order: stroke; stroke: #fff; stroke-width: 4px; stroke-linejoin: round; }
    </style>
  </defs>

  <!-- columns -->
  <rect class="col" x="8" y="40" width="262" height="450" rx="10"/>
  <rect class="col" x="330" y="40" width="250" height="380" rx="10"/>
  <rect class="col col-bsky" x="650" y="40" width="242" height="450" rx="10"/>

  <text class="head" x="139" y="66" text-anchor="middle">Conference website</text>
  <text class="sub" x="139" y="82" text-anchor="middle">static pages</text>
  <text class="head" x="455" y="66" text-anchor="middle">Discussion service</text>
  <text class="head" x="771" y="66" text-anchor="middle">Bluesky</text>

  <!-- website column -->
  <rect class="box" x="22" y="246" width="234" height="140" rx="6"/>
  <text class="name" x="37" y="291">Paper page</text>
  <text class="sub" x="37" y="313">shows the thread under the abstract</text>
  <text class="sub" x="37" y="345">knows only its paper id</text>

  <rect class="box" x="22" y="412" width="170" height="50" rx="6"/>
  <text class="name" x="37" y="434">Conference login</text>
  <text class="sub" x="37" y="452">identifies the attendee</text>

  <!-- service column -->
  <rect class="box" x="344" y="100" width="222" height="50" rx="6"/>
  <text class="name" x="359" y="122">Program database</text>
  <text class="sub" x="359" y="140">sessions, papers, authors</text>

  <rect class="box" x="344" y="174" width="222" height="64" rx="6"/>
  <text class="name" x="359" y="197">Announce bot</text>
  <text class="sub" x="359" y="215">one post per paper,</text>
  <text class="sub" x="359" y="231">shortly before its session</text>

  <rect class="box" x="344" y="265" width="222" height="50" rx="6"/>
  <text class="name" x="359" y="287">Read proxy</text>
  <text class="sub" x="359" y="305">paper id → thread</text>

  <rect class="box" x="344" y="342" width="222" height="64" rx="6"/>
  <text class="name" x="359" y="365">Guest bridge</text>
  <text class="sub" x="359" y="383">comments and likes without</text>
  <text class="sub" x="359" y="399">a Bluesky account</text>

  <!-- bluesky column -->
  <rect class="box-bsky" x="664" y="181" width="214" height="50" rx="6"/>
  <text class="name" x="679" y="203">@papers.ieeevis.org</text>
  <text class="sub" x="679" y="221">the announcements</text>

  <rect class="box-bsky" x="664" y="342" width="214" height="64" rx="6"/>
  <text class="name" x="679" y="365">@discuss.ieeevis.org</text>
  <text class="sub" x="679" y="383">guest comments, under</text>
  <text class="sub" x="679" y="399">a name or a pseudonym</text>

  <rect class="box-bsky" x="664" y="420" width="214" height="50" rx="6"/>
  <text class="name" x="679" y="442">An attendee's own account</text>
  <text class="sub" x="679" y="460">or a reply in the Bluesky app</text>

  <!-- arrows -->
  <path class="arrow" d="M 455 150 V 172"/>

  <path class="arrow" d="M 107 412 V 388"/>
  <text class="label" x="115" y="404">token</text>

  <path class="arrow" d="M 256 290 H 342"/>
  <text class="label" x="300" y="284" text-anchor="middle">paper id</text>

  <path class="arrow" d="M 256 374 H 342"/>
  <text class="label" x="300" y="368" text-anchor="middle">comment, like</text>

  <path class="arrow" d="M 566 206 H 662"/>
  <text class="label" x="615" y="200" text-anchor="middle">posts</text>

  <path class="arrow" d="M 566 290 H 648"/>
  <text class="label" x="614" y="284" text-anchor="middle">reads thread</text>

  <path class="arrow" d="M 566 374 H 662"/>
  <text class="label" x="615" y="368" text-anchor="middle">posts as</text>

  <path class="arrow" d="M 240 386 V 444 H 662"/>
  <text class="label" x="455" y="438" text-anchor="middle">log in as themselves and post from the page</text>
</svg>
